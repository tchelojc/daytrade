        // FUNÇÕES DE CRIPTOGRAFIA (Web Crypto API)
        // ====================================================
        async function derivarChave(licenseId, salt) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(licenseId),
                { name: 'PBKDF2' },
                false,
                ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        async function descriptografar(encryptedData, licenseId) {
            try {
                const salt = Uint8Array.from(atob(encryptedData.salt), c => c.charCodeAt(0));
                const iv = Uint8Array.from(atob(encryptedData.iv), c => c.charCodeAt(0));
                const data = Uint8Array.from(atob(encryptedData.data), c => c.charCodeAt(0));
                const key = await derivarChave(licenseId, salt);
                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    data
                );
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                console.error('Erro na descriptografia:', e);
                return null;
            }
        }
